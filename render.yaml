services:
  - type: web
    name: axion
    env: python
    plan: free
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn core.wsgi:application
    domains:
      - certificados.dscientifica.com.br
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,certificados.dscientifica.com.br"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PUBLIC_CERTIFICATE_HOSTS
        value: "certificados.dscientifica.com.br"
      - key: PUBLIC_CERTIFICATE_BASE_URL
        value: "https://certificados.dscientifica.com.br"
      - key: DATABASE_URL
        sync: false
      - key: DOCUMENT_STORAGE_MODE
        value: r2
      - key: DOCUMENT_R2_ENABLED
        value: "1"
